name: Update DWZ list

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dwz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch DWZ data from the chess federation
        env:
          DSB_API_TOKEN: ${{ secrets.DSB_API_TOKEN }}
        run: node scripts/update-dwz.mjs

      - name: Commit changes
        run: |
          if git diff --quiet docs/content.json; then
            echo "No changes to the DWZ list."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898024+github-actions[bot]@users.noreply.github.com"
            git add docs/content.json
            git commit -m "Update DWZ list from the chess federation (Wertungsportal)"
            git pull --rebase origin main
            git push
          fi
